 
server {
    listen 80;
    server_name SERVER_NAME;

    location /alvo/ {
        rewrite ^/alvo/(.*)$ /$1 last;
    }

    location = /alvo {
        return 301 /alvo/;
    }

    location / {
        root /usr/share/nginx/html/;
        index index.html index.htm;
        try_files $uri /index.html;
    }

}